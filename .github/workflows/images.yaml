name: Build and publish Jenkins images
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [controller, agent]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "image=ghcr.io/${OWNER,,}/pdd-jenkins-${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          load: true
          tags: jenkins-test:${{ matrix.image }}
      - name: Smoke test
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "$IMAGE" = controller ]; then
            docker run --rm --entrypoint bash jenkins-test:controller -ec 'java -jar /usr/share/jenkins/jenkins.war --version; test -f /usr/share/jenkins/ref/plugins/configuration-as-code.jpi; test -f /usr/share/jenkins/ref/plugins/docker-workflow.jpi'
          else
            docker run --rm --entrypoint bash jenkins-test:agent -ec 'java -version; git --version; docker --version; test -z "$(command -v python3)"; test "$(id -u)" != 0'
          fi
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: Publish tested image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
