name: Build and publish Jenkins images
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select images affected by a main push
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          images = ['controller', 'agent']
          if os.environ['EVENT_NAME'] == 'push' and os.environ['EVENT_REF'] == 'refs/heads/main':
              before = os.environ.get('BEFORE_SHA', '')
              available = bool(before and set(before) != {'0'}) and subprocess.run(
                  ['git', 'cat-file', '-e', before + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if available:
                  # Compare the entire push, including both sides of renames.
                  paths = subprocess.check_output([
                      'git', 'diff', '--name-only', '--no-renames', '-z', before, 'HEAD', '--',
                  ]).decode().split('\0')
                  shared = any(path in {'.dockerignore', '.github/workflows/images.yaml'} for path in paths)
                  images = [name for name in images if shared or any(
                      path.startswith((name + '/', 'tools/', 'tests/') if name == 'controller' else (name + '/',))
                      for path in paths
                  )]
              else:
                  print('No previous commit available; build both images for the initial or rewritten history.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('images=' + json.dumps(images, separators=(',', ':')) + '\n')
          print('Selected images:', images)
          PYTHON
  images:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "image=ghcr.io/${OWNER,,}/pdd-jenkins-${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          load: true
          tags: jenkins-test:${{ matrix.image }}
      - name: Smoke test
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "$IMAGE" = controller ]; then
            docker run --rm --entrypoint bash jenkins-test:controller -ec 'java -jar /usr/share/jenkins/jenkins.war --version; test -f /usr/share/jenkins/ref/plugins/configuration-as-code.jpi; test -f /usr/share/jenkins/ref/plugins/docker-workflow.jpi'
          else
            docker run --rm --entrypoint bash jenkins-test:agent -ec 'java -version; git --version; docker --version; test -z "$(command -v python3)"; test "$(id -u)" != 0'
          fi
      - uses: docker/login-action@v3
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=v1.0.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Publish tested image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
